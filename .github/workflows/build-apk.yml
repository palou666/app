name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set apt sources to Tsinghua mirror
      run: |
        sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
        sudo apt update

    - name: Install system dependencies
      run: |
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer
      run: |
        pip3 install --user Cython==0.29.33 virtualenv
        pip3 install --user buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build with buildozer
      run: |
        cd $GITHUB_WORKSPACE
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-APK
        path: ./bin/*.apk
